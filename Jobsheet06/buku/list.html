<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>SIMPUS-Mini | Daftar Buku</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/data-loader.js"></script>
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Buku</a></li>
                <li><a href="tambah.html">Tambah Buku</a></li>
                <li><a href="../anggota/list.html">Daftar Anggota</a></li>
                <li><a href="../anggota/tambah.html">Tambah Anggota</a></li>
            </ul>
        </nav>
        <button type="button" id="nav-toggle-btn" aria-label="Buka menu">&#9776;</button>
    </header>

    <main>
        <section>
            <h2>Daftar Buku</h2>
            <div class="table-responsive">
                <div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem;">
                    <input type="search" id="search-input" placeholder="Cari buku berdasarkan judul..." style="margin-bottom: 0;">
                    <button type="button" id="btn-reload" style="padding: 0.55rem 1rem; background-color: #5c3d2e; color: white; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap;">Muat Ulang</button>
                </div>
                <p id="table-counter"></p>
                <div id="loading-indicator" style="display: none; padding: 0.5rem 0; color: #5c3d2e; font-weight: 600;">Memuat data...</div>
                <table id="tabel-buku">
                    <thead>
                        <tr>
                            <th>Judul</th>
                            <th>Pengarang</th>
                            <th>Tahun</th>
                            <th>Stok</th>
                            <th>Kategori</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Diisi dinamis oleh data-loader.js -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 1</p>
    </footer>
</body>
</html>
